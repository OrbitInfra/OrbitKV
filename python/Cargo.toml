[package]
name = "orbitkv-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "orbitkv"
crate-type = ["cdylib"]

# Cache Manager binary included in the wheel by maturin.
[[bin]]
name = "orbitkv-cache-manager-py"
path = "src/bin/cache_manager.rs"

[features]
test-hooks = ["orbitkv-channel/test-hooks"]
default = ["cuda-13", "orbite"]
cuda-13 = ["orbitkv-core/cuda-13", "orbitkv-server/cuda-13"]
orbite = ["orbitkv-core/orbite", "orbitkv-server/orbite"]
orbite-gds = ["orbite", "orbitkv-core/orbite-gds", "orbitkv-server/orbite-gds"]
orbite-rdma = ["orbite", "orbitkv-core/orbite-rdma", "orbitkv-server/orbite-rdma"]

[dependencies]
log.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
orbitkv-common.workspace = true
orbitkv-state.workspace = true
orbitkv-core = { workspace = true, default-features = false }
orbitkv-channel.workspace = true
orbitkv-proto = { path = "../crates/orbitkv-proto" }
orbitkv-server = { path = "../crates/orbitkv-server", default-features = false }
tokio.workspace = true
prost.workspace = true
uuid.workspace = true
libc.workspace = true
serde_json.workspace = true
