name: Retry CI scheduling failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

concurrency:
  group: ci-scheduling-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      # No checkout, artifacts or PR code execute with this write token.
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.payload.workflow_run.id;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.path !== '.github/workflows/ci.yml' || run.status !== 'completed' ||
                run.conclusion !== 'failure' || run.run_attempt !== 1 ||
                !(run.event === 'pull_request' || (run.event === 'push' && run.head_branch === 'main'))) {
              core.info(`Run ${run_id} is outside the first-attempt CI scheduling recovery scope.`);
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {owner, repo, run_id, filter: 'latest', per_page: 100});
            const unsafe = jobs.filter(job =>
              !(['success', 'skipped'].includes(job.conclusion) ||
                (job.conclusion === null && job.status === 'queued' && !job.started_at)));
            if (unsafe.length) {
              core.info(`Not retrying ${run_id}: actual failed, started or uncertain jobs: ` +
                unsafe.map(job => `${job.name}=${job.conclusion}/${job.status}`).join(', '));
              return;
            }
            // A human may have rerun it while the jobs were being listed.
            const {data: latest} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (latest.run_attempt !== 1 || latest.status !== 'completed' || latest.conclusion !== 'failure') {
              core.info(`Run ${run_id} changed while inspecting jobs; no retry.`);
              return;
            }
            core.info(`Retrying CI ${run_id} once: overall failure, ${jobs.length} created jobs, ` +
              'all successful/skipped or never started. This is a workflow scheduling failure.');
            await github.rest.actions.reRunWorkflow({owner, repo, run_id});
