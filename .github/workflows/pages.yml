name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pinned docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build strict documentation
        run: sphinx-build -b dirhtml -n -W --keep-going docs "$RUNNER_TEMP/orbitkv-docs"
      - name: Validate links, fragments and redirects
        run: |
          python docs/check_site.py "$RUNNER_TEMP/orbitkv-docs"
          python -m unittest discover -s docs/tests
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/orbitkv-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          : "${ARTIFACT_NAME:?Missing Pages artifact name}" "${ARTIFACT_ID:?Missing Pages artifact ID}"
          run_artifacts="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          deadline=$((SECONDS + 60))
          while true; do
            visible_ids=$(gh api "$run_artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id')
            if [[ "$visible_ids" == "$ARTIFACT_ID" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Pages artifact $ARTIFACT_ID was not uniquely visible in run $GITHUB_RUN_ID"
              exit 1
            fi
            sleep 5
          done
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
