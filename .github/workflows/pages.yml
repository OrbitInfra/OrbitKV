name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pinned docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build strict documentation
        run: sphinx-build -b dirhtml -n -W --keep-going docs "$RUNNER_TEMP/orbitkv-docs"
      - name: Validate links, fragments and redirects
        run: |
          python docs/check_site.py "$RUNNER_TEMP/orbitkv-docs"
          python -m unittest discover -s docs/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/orbitkv-docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
