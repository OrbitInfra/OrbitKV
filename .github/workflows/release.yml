name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check package versions and release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/check-versions.py --engines --publication --tag "$RELEASE_TAG"
          else
            python3 scripts/check-versions.py --engines
            echo 'Candidate only. Git-sourced OrbiTE must become a reviewed crates.io pin before publication.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install CUDA Toolkit
        uses: ./.github/actions/install-cuda

      - name: Install native build dependencies
        run: |
          # Explicitly select glog's headers over the runner's LLVM libunwind variant.
          bash .github/scripts/retry-install.sh apt-get install -y libunwind-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libcli11-dev liburing-dev libboost-dev patchelf

      - name: Install protocol compiler
        run: bash scripts/install-protoc.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel 'tomli; python_version < "3.11"'

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release --locked
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-x86_64" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  build-arm:
    needs: version
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        uses: ./.github/actions/install-cuda

      - name: Install native build dependencies
        run: |
          bash .github/scripts/retry-install.sh apt-get install -y \
            libibverbs-dev \
            librdmacm-dev \
            libnuma-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libcurl4-openssl-dev \
            ninja-build \
            libcli11-dev \
            liburing-dev \
            libboost-dev \
            patchelf \
            pkg-config

      - name: Install protocol compiler
        run: bash scripts/install-protoc.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel 'tomli; python_version < "3.11"'

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release --locked
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda-13.0
          # Grace systems commonly use 64 KiB kernel pages, while the runner uses 4 KiB.
          JEMALLOC_SYS_WITH_LG_PAGE: "16"

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-aarch64" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  verify-artifacts:
    needs: [build, build-arm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: orbitkv-wheel-*
          merge-multiple: true
          path: dist
      - name: Validate complete release artifacts
        run: |
          VERSION="$(python3 scripts/check-versions.py)"
          python3 scripts/check-wheel.py dist --release-dir --version "$VERSION"
          python3 scripts/check-versions.py --format json > dist/PROVENANCE.json
          RUST_VERSION="$(python3 scripts/check-versions.py --format rust)"
          printf '# OrbitKV %s\n\nPython: `%s`.\n\n[Release notes and limits](https://github.com/OrbitInfra/OrbitKV/blob/%s/docs/releases.md).\n\nGPU serving and OrbiTE GPU/RDMA/GDS profiles remain unqualified on this artifact. Rust crates are private; the sole distribution is the PyPI wheel.\n' \
            "$RUST_VERSION" "$VERSION" "$GITHUB_SHA" > dist/RELEASE-NOTES.md
          (cd dist && sha256sum *.whl PROVENANCE.json RELEASE-NOTES.md > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'push'
    needs: verify-artifacts
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download tested release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Verify hashes and select only wheels
        run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          mkdir dist
          cp release-artifacts/*.whl dist/
      - name: Publish orbitkv to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Verify the PyPI receipt without retrying uploads
        run: python3 scripts/check-wheel.py dist --release-dir --version "$(python3 scripts/check-versions.py)" --verify-pypi

  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Release only the existing tag after the registry receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" --title "$RELEASE_TAG" \
            --notes-file release-artifacts/RELEASE-NOTES.md release-artifacts/*.whl \
            release-artifacts/SHA256SUMS release-artifacts/PROVENANCE.json

  outcome:
    if: always()
    needs: [version, build, build-arm, verify-artifacts, publish-pypi, github-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Report candidate or publication results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo 'Manual runs never publish. A failed upload may be partial: compare PyPI hashes before recovery; never blindly rerun uploads or rebuild the same version.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
