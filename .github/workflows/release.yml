name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check package versions and release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/check-versions.py --tag "$RELEASE_TAG"
          else
            python3 scripts/check-versions.py
          fi

  build:
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.0.2'
          linux-local-args: '["--toolkit"]'
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          # Explicitly select glog's headers over the runner's LLVM libunwind variant.
          sudo apt-get install -y libunwind-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libboost-dev patchelf

      - name: Install protocol compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-x86_64" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  build-arm:
    needs: version
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA 13 toolkit and build dependencies
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y \
            cuda-cudart-dev-13-0 \
            cuda-nvcc-13-0 \
            cuda-nvrtc-dev-13-0 \
            libibverbs-dev \
            librdmacm-dev \
            libnuma-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libcurl4-openssl-dev \
            ninja-build \
            libboost-dev \
            patchelf \
            pkg-config

      - name: Install protocol compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda-13.0
          # Grace systems commonly use 64 KiB kernel pages, while the runner uses 4 KiB.
          JEMALLOC_SYS_WITH_LG_PAGE: "16"

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-aarch64" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  verify-artifacts:
    needs: [build, build-arm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orbitkv-wheel-*
          merge-multiple: true
          path: dist
      - name: Validate complete release artifacts
        run: |
          VERSION="$(python3 scripts/check-versions.py)"
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          test "${#WHEELS[@]}" -eq 10
          for WHEEL in "${WHEELS[@]}"; do
            python3 scripts/check-wheel.py "$WHEEL" --version "$VERSION"
          done

  publish-release:
    if: github.event_name == 'push'
    needs: verify-artifacts
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orbitkv-wheel-*
          merge-multiple: true
          path: dist

      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      - name: Publish orbitkv-llm to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
