name: "CI"

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  docs-check:
    name: documentation
    needs:
      - ruff-check
      - python-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pinned docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build strict documentation
        run: sphinx-build -b dirhtml -n -W --keep-going docs "$RUNNER_TEMP/orbitkv-docs"
      - name: Validate links, fragments and redirects
        run: |
          python docs/check_site.py "$RUNNER_TEMP/orbitkv-docs"
          python -m unittest discover -s docs/tests

  commit-check:
    name: commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitizen
        run: pip install commitizen
      - name: Check last commit message
        run: |
          git log -1 --format=%B "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/commit-message.txt"
          cz check --commit-msg-file "$RUNNER_TEMP/commit-message.txt"

  version-consistency-check:
    name: version consistency check
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select native checks
        id: scope
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          native = True
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              # Checkout supplies the PR merge commit; its first parent is the base.
              # Disable rename detection so deleting/moving native source stays visible.
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", "-z", "HEAD^1", "HEAD"],
                  capture_output=True,
              )
              if changed.returncode == 0:
                  paths = [os.fsdecode(path) for path in changed.stdout.split(b"\0") if path]
                  native = any(
                      not (
                          (path.endswith(".md") and path != "python/README.md")
                          or path.startswith("docs/")
                          or (path.startswith(("benches/", "python/tests/")) and path.endswith(".py"))
                      )
                      for path in paths
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"native={str(native).lower()}\n")
          print(f"Native build checks required: {native}")
          PY
      - name: Reject tracked experiment output
        run: python3 scripts/check-experiment-output.py
      - name: Confine native backend feature gates
        run: python3 scripts/check-backend-features.py
      - name: Check Rust and Python package versions stay in sync
        run: python3 scripts/check-versions.py --engines

  typos-check:
    name: typos check
    needs:
      - commit-check
      - version-consistency-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run typos check
        uses: crate-ci/typos@v1.50.2

  rust-fmt-check:
    name: rust fmt check
    needs:
      - commit-check
      - version-consistency-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Run rust format check
        run: |
          cargo fmt --all -- --check

  rust-clippy-check:
    name: rust clippy check
    # Keep heavy jobs in bounded waves. Some runner pools cancel jobs that stay
    # eligible but unassigned for 15 minutes.
    needs: [build-wheel, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install CUDA Toolkit
        uses: ./.github/actions/install-cuda
      - name: Install native build dependencies
        run: |
          bash .github/scripts/retry-install.sh sudo apt-get update
          bash .github/scripts/retry-install.sh sudo apt-get install -y pkg-config clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev liburing-dev patchelf
      - name: Install protocol compiler
        run: bash scripts/install-protoc.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true # The next step requires working cached or direct rustc.
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh
      - name: Run rust clippy check
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features --features cuda-13,test-hooks -- -D warnings
          cargo clippy --locked --workspace --all-targets --features test-hooks -- -D warnings
          CC=gcc CXX=g++ cargo clippy --locked --workspace --all-targets --no-default-features --features cuda-13,orbite-rdma,orbite-gds,test-hooks -- -D warnings
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

  ruff-check:
    name: ruff check
    needs:
      - typos-check
      - rust-fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.14"

  python-unit-tests:
    name: python unit tests
    needs:
      - typos-check
      - rust-fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Check bounded CI recovery controls
        run: |
          node --test .github/tests/workflow-recovery.cjs
          python3 -m unittest discover -s .github/tests
      - name: Run default Python test gate
        working-directory: python
        run: |
          uv run --isolated --no-project --with pytest --with numpy --with 'requests>=2.26.0' pytest
      - name: Check benchmark measurements and reporting
        run: |
          uv run --isolated --no-project --with pytest --with numpy --with 'requests>=2.26.0' pytest benches/tests

  cargo-check-native:
    name: cargo check (CUDA 13)
    # Finish the short feedback waves before consuming the available runners
    # with CUDA builds, so no job expires while waiting for a runner.
    needs: [docs-check, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install CUDA Toolkit
        uses: ./.github/actions/install-cuda
      - name: Install native build dependencies
        run: |
          bash .github/scripts/retry-install.sh sudo apt-get update
          bash .github/scripts/retry-install.sh sudo apt-get install -y pkg-config clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev liburing-dev patchelf
      - name: Install protocol compiler
        run: bash scripts/install-protoc.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true # The next step requires working cached or direct rustc.
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh
      - name: Run cargo check
        run: |
          cargo check -p orbitkv-core
          cargo check --locked -p orbitkv-server --all-targets --features test-hooks
          cargo check -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbite
          CC=gcc CXX=g++ cargo clippy --locked -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbite-rdma -- -D warnings
          CC=gcc CXX=g++ cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite-rdma --lib peer::orbite::tests
          CC=gcc CXX=g++ cargo test --locked -p orbitkv-server --no-default-features --features cuda-13,orbite-rdma --lib tests::orbite_rdma_cli_requires_explicit_device_and_valid_port -- --exact
          cargo check -p orbitkv-server --all-targets --no-default-features --features cuda-13
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13 --lib storage::tests::unavailable_rdma_backend_is_rejected_before_pinned_allocation -- --exact
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib peer::orbite::tests
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib peer::completion::tests
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib peer::completion::tests::unquiesced_transfer_retains_source_ticket_and_actual_buffer_owner -- --exact --ignored
          cargo check -p orbitkv-server --all-targets
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18
      - name: Peer backend CPU ownership and TCP byte gates
        run: |
          mkdir -p "$RUNNER_TEMP/orbitkv-cpu-host-control"
          c++ -std=c++20 -shared -fPIC -DORBITKV_CPU_HOST_CONTROL -x c++ crates/orbitkv-core/tests/native/source_owner_host_shim.cu -o "$RUNNER_TEMP/orbitkv-cpu-host-control/libcudart.so"
          # The shim exercises host ownership only; it is not CUDA evidence.
          for filter in peer:: query:: planning:: metrics:: transfer_engine::tests \
            codec:: engine::restore:: storage::inventory:: \
            transfer::worker::drain_tests::nonresident_payloads_return_errors_without_host_access \
            transfer::tests::raw_copy_shape \
            missing_orbite_worker_engine no_backend_storage; do
            LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" cargo test --locked -p orbitkv-core --no-default-features --features cuda-13 --lib "$filter" -- --test-threads=1
          done
          LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib peer::
          LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" cargo test --locked -p orbitkv-core --lib peer::
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib query::read::tests
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite --lib transfer_engine::tests
          cargo test --locked -p orbitkv-server --lib tests::auto_is_default_and_explicit_transport_hints_remain_available -- --exact
          cargo test --locked -p orbitkv-core --lib query::read::tests
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

      - name: OrbiTE local-copy CPU CUDA-shim byte and ownership gates
        run: |
          mkdir -p "$RUNNER_TEMP/orbitkv-local-copy-control"
          c++ -std=c++20 -Wall -Wextra -Werror -shared -fPIC crates/orbitkv-core/tests/native/local_copy_cuda_shim.cpp -o "$RUNNER_TEMP/orbitkv-local-copy-control/libcuda.so.1"
          ln -s libcuda.so.1 "$RUNNER_TEMP/orbitkv-local-copy-control/libcuda.so"
          # Driver calls move CPU fixture bytes, not hardware-qualified GPU bytes.
          export LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-local-copy-control:$RUNNER_TEMP/orbitkv-cpu-host-control"
          export ORBITKV_REQUIRE_LOCAL_COPY_SHIM=1
          cargo test --locked -p orbitkv-core --lib codec::tests::raw_device_checksum_is_bounded_and_detects_corruption -- --exact --ignored
          cargo test --locked -p orbitkv-core --lib transfer::worker::drain_tests::sealed_host_decode_trusts_ecc_and_rejects_unsealed_or_poisoned_sources -- --exact --ignored
          cargo test --locked -p orbitkv-core --lib transfer::worker::peer::tests::raw_peer_gpu_receive_checks_once_after_drain_before_readiness -- --exact --ignored
          cargo test --locked -p orbitkv-server --lib registry::tests::tensor_owner_survives_registry_removal -- --exact --ignored
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite-gds --lib peer::orbite::local::tests -- --ignored --test-threads=1
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite-gds --lib transfer::local::tests::failed_import_cleanup_preserves_registered_mapping -- --exact --ignored
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite-gds --lib memory::pinned::tests::unregister_failure_policy -- --exact --ignored
          cargo test --locked -p orbitkv-server --no-default-features --features cuda-13,test-hooks --lib -- --test-threads=1
          cargo test --locked -p orbitkv-server --features orbite,test-hooks --lib -- --test-threads=1
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

      - name: SSD engine real-file byte and ownership gates
        run: |
          CC=gcc CXX=g++ cargo clippy --locked -p orbitkv-server -p orbitkv-core --all-targets --no-default-features --features cuda-13,orbite-gds -- -D warnings
          # CUDA host-registration is a CPU fixture; io_uring and file bytes are real.
          export ORBITKV_SSD_TEST_ROOT="$RUNNER_TEMP/ssd-ext4"
          export ORBITKV_SSD_TEST_FS=ext4
          mkdir -p "$ORBITKV_SSD_TEST_ROOT"
          test "$(findmnt -n -o FSTYPE -T "$ORBITKV_SSD_TEST_ROOT")" = ext4
          for fs in ext4 tmpfs; do
            if [[ "$fs" == tmpfs ]]; then export ORBITKV_SSD_TEST_ROOT=/dev/shm; fi
            LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" ORBITKV_REQUIRE_ENGINE_SSD=1 ORBITKV_SSD_TEST_FS="$fs" cargo test --locked -p orbitkv-core --no-default-features --features orbite-gds,cudarc/cuda-13000,cudarc/nvrtc --lib storage::ssd::io::tests::engine -- --ignored --test-threads=1
            LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-local-copy-control:$RUNNER_TEMP/orbitkv-cpu-host-control" ORBITKV_REQUIRE_ENGINE_SSD=1 ORBITKV_REQUIRE_LOCAL_COPY_SHIM=1 cargo test --locked -p orbitkv-core --lib transfer::worker::ssd::queue::tests::raw_gpu_corruption_invalidates_completion_and_retains_the_extent_until_drain -- --exact --ignored
          done
          LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" ORBITKV_SSD_TEST_ROOT="$RUNNER_TEMP/ssd-ext4" ORBITE_REQUIRE_IO_URING=1 cargo test --locked -p orbitkv-core --lib peer::read::tests::path_bench::tier_crossings_scan_once_and_never_publish_corrupt_receives -- --exact --ignored
          LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" cargo test --locked -p orbitkv-core --lib integrity::tests
          LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-cpu-host-control" cargo test --locked -p orbitkv-core --lib storage::ssd:: -- --test-threads=1
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbite-gds --lib peer::orbite::tests::compiled_gds_stays_unloaded_without_configuration -- --exact
          cargo test --locked -p orbitkv-core --lib transfer::worker::ssd:: -- --test-threads=1
          cargo test --locked -p orbitkv-server --lib tests::ssd_uses_selected_engine_and_rejects_removed_legacy_switch -- --exact
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

      - name: Persistent SSD Manager SIGKILL and recovery gates
        run: |
          cargo clippy --locked -p orbitkv-server --features test-hooks --all-targets -- -D warnings
          cargo build --locked -p orbitkv-server --features test-hooks --bin orbitkv-cache-manager
          export LD_LIBRARY_PATH="$RUNNER_TEMP/orbitkv-local-copy-control:$RUNNER_TEMP/orbitkv-cpu-host-control"
          export ORBITKV_REQUIRE_ENGINE_SSD=1 ORBITE_REQUIRE_IO_URING=1
          mkdir -p "$RUNNER_TEMP/ssd-process-mount" "$RUNNER_TEMP/ssd-process-results"
          truncate -s 32M "$RUNNER_TEMP/ssd-process.ext4"
          mkfs.ext4 -F -m 0 "$RUNNER_TEMP/ssd-process.ext4"
          for fs in ext4 tmpfs; do
            if [[ "$fs" == ext4 ]]; then
              sudo mount -o loop "$RUNNER_TEMP/ssd-process.ext4" "$RUNNER_TEMP/ssd-process-mount"
            else
              sudo mount -t tmpfs -o size=32m tmpfs "$RUNNER_TEMP/ssd-process-mount"
            fi
            trap 'sudo umount "$RUNNER_TEMP/ssd-process-mount"' EXIT
            sudo chown "$USER" "$RUNNER_TEMP/ssd-process-mount"
            python3 crates/orbitkv-server/tests/process/ssd_persistence.py \
              --binary target/debug/orbitkv-cache-manager \
              --root "$RUNNER_TEMP/ssd-process-mount" --filesystem "$fs" \
              --artifacts "$RUNNER_TEMP/ssd-process-results/$fs"
            sudo umount "$RUNNER_TEMP/ssd-process-mount"
            trap - EXIT
          done
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18
      - name: Upload SSD process-crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssd-process-crash
          path: ${{ runner.temp }}/ssd-process-results
          if-no-files-found: ignore

  cargo-check:
    name: cargo check
    if: always()
    needs: [cargo-check-native, docs-check, version-consistency-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.version-consistency-check.result }}" != "success" || "${{ needs.docs-check.result }}" != "success" ]]; then
            echo "prerequisite checks failed"
            exit 1
          fi
          case "${{ needs.version-consistency-check.outputs.native }}:${{ needs.cargo-check-native.result }}" in
            true:success) echo "native checks passed" ;;
            false:skipped) echo "documentation and Python harness changes: native checks not required" ;;
            *) echo "native checks failed or scope is unavailable"; exit 1 ;;
          esac

  build-wheel:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - check-name: build Python 3.14 wheel (CUDA 13, OrbiTE TCP)
            python: '3.14'
            features: ""
            artifact: orbitkv-wheel-ci
          - check-name: build Python 3.14 wheel (CUDA 13, OrbiTE RDMA)
            python: '3.14'
            features: orbite-rdma
            artifact: orbitkv-wheel-ci-orbite-rdma
          - check-name: build Python 3.12 wheel and engine API controls
            python: '3.12'
            features: ""
            artifact: orbitkv-wheel-ci-engine-api
    needs: [cargo-check, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install CUDA Toolkit
        uses: ./.github/actions/install-cuda

      - name: Install native build dependencies
        run: |
          bash .github/scripts/retry-install.sh sudo apt-get update
          bash .github/scripts/retry-install.sh sudo apt-get install -y clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libcli11-dev liburing-dev libboost-dev patchelf

      - name: Install protocol compiler
        run: bash scripts/install-protoc.sh

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true # The next step requires working cached or direct rustc.
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel 'tomli; python_version < "3.11"'

      - name: Build wheel
        run: |
          if [[ -n "$WHEEL_FEATURES" ]]; then
            CC=gcc CXX=g++ ./scripts/build-wheel.sh --release --features "$WHEEL_FEATURES"
            python scripts/check-wheel.py target/wheels/*.whl --install-smoke --require-orbite-rdma
          else
            ./scripts/build-wheel.sh --release
          fi
        env:
          CUDA_PATH: /usr/local/cuda
          WHEEL_FEATURES: ${{ matrix.features }}
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/wheels/*.whl
          retention-days: 1

      - name: Check installed official engine APIs without a GPU
        if: matrix.python == '3.12'
        run: |
          pip install uv==0.13.7
          scripts/check-engine-apis.sh "$RUNNER_TEMP/engine-api" target/wheels/*.whl

      - name: Upload engine API evidence
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: engine-api-controls
          path: |
            ${{ runner.temp }}/engine-api/*-freeze.txt
            ${{ runner.temp }}/engine-api/*.xml
            ${{ runner.temp }}/engine-api/*-evidence.json
          retention-days: 14
