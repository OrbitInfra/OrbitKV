name: "CI"

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  website-check:
    name: website and documentation
    needs:
      - ruff-check
      - python-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and audit
        working-directory: website
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Check and publish locally
        working-directory: website
        run: |
          npm run check
          npm run build
          npm test

  commit-check:
    name: commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitizen
        run: pip install commitizen
      - name: Check last commit message
        run: |
          git log -1 --format=%B "${{ github.event.pull_request.head.sha || github.sha }}" > "$RUNNER_TEMP/commit-message.txt"
          cz check --commit-msg-file "$RUNNER_TEMP/commit-message.txt"

  version-consistency-check:
    name: version consistency check
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select native checks
        id: scope
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          native = True
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              # Checkout supplies the PR merge commit; its first parent is the base.
              # Disable rename detection so deleting/moving native source stays visible.
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", "-z", "HEAD^1", "HEAD"],
                  capture_output=True,
              )
              if changed.returncode == 0:
                  paths = [os.fsdecode(path) for path in changed.stdout.split(b"\0") if path]
                  native = any(
                      not (
                          (path.endswith(".md") and path != "python/README.md")
                          or path.startswith("website/")
                          or (path.startswith(("benches/", "python/tests/")) and path.endswith(".py"))
                      )
                      for path in paths
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"native={str(native).lower()}\n")
          print(f"Native build checks required: {native}")
          PY
      - name: Reject tracked experiment output
        run: python3 scripts/check-experiment-output.py
      - name: Check Rust and Python package versions stay in sync
        run: python3 scripts/check-versions.py --engines

  typos-check:
    name: typos check
    needs:
      - commit-check
      - version-consistency-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run typos check
        uses: crate-ci/typos@v1.50.2

  rust-fmt-check:
    name: rust fmt check
    needs:
      - commit-check
      - version-consistency-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Run rust format check
        run: |
          cargo fmt --all -- --check

  rust-clippy-check:
    name: rust clippy check
    # Keep heavy jobs in bounded waves. Some runner pools cancel jobs that stay
    # eligible but unassigned for 15 minutes.
    needs: [build-wheel, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.0.2'
          linux-local-args: '["--toolkit"]'
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libboost-dev
      - name: Install protocol compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh
      - name: Run rust clippy check
        run: |
          cargo clippy --workspace --exclude orbitkv-py --all-targets -- -D warnings
          cargo clippy -p orbitkv-server --all-targets --features test-hooks -- -D warnings
          cargo clippy -p orbitkv-core --all-targets --features orbitte -- -D warnings
          cargo clippy -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbitte -- -D warnings
          CC=gcc CXX=g++ cargo clippy -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbitte-rdma -- -D warnings
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

  ruff-check:
    name: ruff check
    needs:
      - typos-check
      - rust-fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.14"

  python-unit-tests:
    name: python unit tests
    needs:
      - typos-check
      - rust-fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Run default Python test gate
        working-directory: python
        run: |
          uv run --isolated --no-project --with pytest --with numpy --with 'requests>=2.26.0' pytest
      - name: Check benchmark measurements and reporting
        run: |
          uv run --isolated --no-project --with pytest --with numpy --with 'requests>=2.26.0' pytest benches/tests

  cargo-check-native:
    name: cargo check (CUDA 13)
    # Finish the short feedback waves before consuming the available runners
    # with CUDA builds, so no job expires while waiting for a runner.
    needs: [website-check, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.0.2'
          linux-local-args: '["--toolkit"]'
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libboost-dev
      - name: Install protocol compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh
      - name: Run cargo check
        run: |
          cargo check -p orbitkv-core
          cargo check -p orbitkv-core --features orbitte
          cargo check -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbitte
          CC=gcc CXX=g++ cargo clippy --locked -p orbitkv-server --all-targets --no-default-features --features cuda-13,orbitte-rdma -- -D warnings
          CC=gcc CXX=g++ cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbitte-rdma --lib peer::orbitte::tests
          CC=gcc CXX=g++ cargo test --locked -p orbitkv-server --no-default-features --features cuda-13,orbitte-rdma --lib tests::orbitte_rdma_cli_requires_explicit_device_and_valid_port -- --exact
          cargo check -p orbitkv-server --all-targets --no-default-features --features cuda-13
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13 --lib storage::tests::unavailable_rdma_backend_is_rejected_before_pinned_allocation -- --exact
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbitte --lib peer::orbitte::tests
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbitte --lib peer::completion::tests
          cargo test --locked -p orbitkv-core --no-default-features --features cuda-13,orbitte --lib peer::completion::tests::unquiesced_transfer_retains_source_ticket_and_actual_buffer_owner -- --exact --ignored
          cargo check -p orbitkv-server --all-targets
        env:
          CUDA_PATH: /usr/local/cuda
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

  cargo-check:
    name: cargo check
    if: always()
    needs: [cargo-check-native, website-check, version-consistency-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.version-consistency-check.result }}" != "success" || "${{ needs.website-check.result }}" != "success" ]]; then
            echo "prerequisite checks failed"
            exit 1
          fi
          case "${{ needs.version-consistency-check.outputs.native }}:${{ needs.cargo-check-native.result }}" in
            true:success) echo "native checks passed" ;;
            false:skipped) echo "documentation and Python harness changes: native checks not required" ;;
            *) echo "native checks failed or scope is unavailable"; exit 1 ;;
          esac

  build-wheel:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - check-name: build Python 3.14 wheel (CUDA 13)
            features: ""
            artifact: orbitkv-wheel-ci
          - check-name: build Python 3.14 wheel (CUDA 13, OrbitTE RDMA)
            features: orbitte-rdma
            artifact: orbitkv-wheel-ci-orbitte-rdma
    needs: [cargo-check, version-consistency-check]
    if: needs.version-consistency-check.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.0.2'
          linux-local-args: '["--toolkit"]'
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libboost-dev patchelf

      - name: Install protocol compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Validate sccache or select direct rustc
        run: scripts/configure-rustc-wrapper.sh

      - name: Install wheel build tools
        run: pip install maturin "auditwheel==6.8.2" "patchelf>=0.14.5" wheel

      - name: Build wheel
        run: |
          if [[ -n "$WHEEL_FEATURES" ]]; then
            CC=gcc CXX=g++ ./scripts/build-wheel.sh --release --features "$WHEEL_FEATURES"
            python scripts/check-wheel.py target/wheels/*.whl --install-smoke --require-orbitte-rdma
          else
            ./scripts/build-wheel.sh --release
          fi
        env:
          CUDA_PATH: /usr/local/cuda
          WHEEL_FEATURES: ${{ matrix.features }}
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/wheels/*.whl
          retention-days: 1
