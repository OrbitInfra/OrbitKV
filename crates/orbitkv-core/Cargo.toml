[package]
name = "orbitkv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-hooks = []
default = ["cuda-13", "mooncake"]
cuda-13 = ["cudarc/cuda-13000", "cudarc/nvrtc", "orbitkv-transfer?/cuda-13"]
mooncake = ["dep:orbitkv-transfer"]
orbite = ["dep:orbite", "orbite/cuda", "orbite/io-uring"]
orbite-gds = ["orbite", "orbite/gds"]
orbite-rdma = ["orbite", "orbite/rdma"]
tracing = ["fastrace"]

[dependencies]
orbitkv-catalog.workspace = true
orbitkv-state.workspace = true
orbitkv-common.workspace = true
cudarc.workspace = true
log.workspace = true
logforth.workspace = true
offset-allocator.workspace = true
hashlink.workspace = true
tokio.workspace = true
uuid.workspace = true
opentelemetry.workspace = true
bytesize.workspace = true
libc.workspace = true
libloading.workspace = true
rand.workspace = true
ahash.workspace = true
base64 = "0.22.1"
half = "2.7"
serde.workspace = true
serde_json.workspace = true
crc32fast = "1.5"
futures.workspace = true
parking_lot.workspace = true
fastrace = { workspace = true, optional = true }
tonic.workspace = true
dashmap.workspace = true
smallvec.workspace = true
orbitkv-proto = { path = "../orbitkv-proto" }
orbitkv-transfer = { path = "../orbitkv-transfer", default-features = false, optional = true }
mea.workspace = true
orbite = { git = "https://github.com/OrbitInfra/OrbiTE", rev = "2e50af25007ca9681912ba5175109d09488a8f99", default-features = false, optional = true }

[dev-dependencies]
rustix.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
criterion.workspace = true
cudarc.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
tempfile = "3"

[[bench]]
name = "pinned_copy"
harness = false

[[bench]]
name = "uds_latency"
harness = false

[[bench]]
name = "cpu_path"
harness = false

[[bench]]
name = "cpu_codec"
path = "../../benches/storage/native/cpu_codec.rs"
harness = false

[[bench]]
name = "transfer_h2d"
harness = false

[[bench]]
name = "native_kernel_copy"
path = "../../benches/transfer/native/native_kernel_copy.rs"
harness = false

[[bench]]
name = "native_copy_layout"
path = "../../benches/transfer/native/native_copy_layout.rs"
harness = false

[[test]]
name = "native_copy_layout"
path = "../../benches/tests/transfer/native_copy_layout.rs"

[[example]]
name = "pinned_alloc"

[[example]]
name = "pinned_alloc_parallel"
