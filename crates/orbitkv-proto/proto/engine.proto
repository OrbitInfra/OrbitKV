syntax = "proto3";

package orbitkv;

message ResponseStatus {
  bool ok = 1;
  string message = 2;
}

// H2D/D2H transfer backend the engine uses for an instance's GPU worker pools.
enum TransferMode {
  TRANSFER_MODE_DIRECT = 0;
  TRANSFER_MODE_KERNEL = 1;
}

// Batch registration request for all layers on a GPU (reduces N RPCs to 1).
//
// Workers declare only the layers that actually exist on the device; the
// engine derives the instance-wide layer-id space once all `world_size`
// workers have registered. Fields 7 (num_layers) and 16 (layer_ids) carried
// the connector-guessed topology and are retired.
message RegisterContextRequest {
  reserved 7, 16;
  reserved "num_layers", "layer_ids";

  string instance_id = 1;
  string namespace = 2;
  uint32 tp_rank = 3;
  uint32 tp_size = 4;
  uint32 world_size = 5;
  // Sender-local CUDA ordinal; data commands use the resolved Manager ordinal.
  int32 device_id = 6;
  repeated string layer_names = 8;
  repeated bytes wrapper_bytes = 9;
  repeated uint64 num_blocks = 10;
  repeated uint64 bytes_per_block = 11;
  repeated uint64 kv_stride_bytes = 12;
  repeated uint32 segments = 13;
  uint32 pp_rank = 14;
  string client_version = 15;
  // Transfer backend the connector chose for this instance (kernel for MLA,
  // direct otherwise; overridable via orbitkv.transfer_backend). The engine
  // spawns this instance's GPU worker pools with the requested backend.
  TransferMode transfer_mode = 17;
  // Page-first storage: collapse all layers of a block into one contiguous
  // page per tp_rank, so total_slots = tp_size instead of num_layers * tp_size.
  // Set by the connector for MLA; the engine derives per-layer page offsets
  // from the registered layouts. See spec.md.
  bool page_first = 18;
  // Hybrid-cache storage group per layer, parallel to layer_names (e.g.
  // vLLM's kv-cache group index: 0 = full attention, 1 = recurrent state).
  // Empty means every layer belongs to group 0, preserving single-group
  // behavior. Groups key blocks independently and seal against their own
  // slot space, so a sparse (checkpoint-only) group can seal without
  // attention's per-block cadence. Page-first stays single-group.
  repeated uint32 layer_group_ids = 19;
  // Typed attention regions eligible for storage quantization: bf16, fp16,
  // or exact for checkpoints/opaque layouts. Validated against imported tensors.
  repeated string layer_formats = 20;
  repeated AttentionStorageLayout layer_attention = 21;
  // Stable identity of every tensor, independent of process visibility/order.
  string device_uuid = 22;
}

message UnregisterRequest {
  string instance_id = 1;
}

message HealthRequest {}

message HealthResponse {
  ResponseStatus status = 1;
}

// Liveness session carried over the authenticated UDS bootstrap connection.
// Closing the socket releases the instance and its imported GPU mappings.
message SessionRequest {
  string instance_id = 1;
  string namespace   = 2;
  uint32 tp_size     = 3;
  uint32 world_size  = 4;
}

// Contiguous scalar head vectors; head_dim=0 means opaque/unavailable.
message AttentionStorageLayout {
  uint32 head_dim = 1;
  string role = 2; // k, v, kv (separate segments), or packed_kv (contiguous head pairs)
  uint32 layer_index = 3;
  uint32 layer_count = 4;
}

// Cross-node transfer: authorized Mooncake-visible ranges.
message TransferSlotInfo {
  uint64 k_ptr = 1;      // Mooncake target address for K segment
  uint64 k_size = 2;     // Size of the K segment in bytes (per-segment, not total slot size)
  uint64 v_ptr = 3;      // Mooncake target address for V segment (0 if contiguous)
  uint64 v_size = 4;     // Size of the V segment in bytes (0 if contiguous)
  bytes encoding = 6; // Versioned storage representation, empty for raw slots
  uint32 numa_node = 5;  // NUMA node where this slot's memory resides (for RDMA NIC affinity)
}

// Cross-node transfer: per-block authorization metadata.
message TransferBlockInfo {
  bytes block_hash = 1;
  repeated TransferSlotInfo slots = 2;  // One per TP slot
}

// Opening a window pins no data. Unknown/evicted windows cannot be recreated
// by authorization, so a closed ticket stays closed even after metadata eviction.
message OpenTransferWindowRequest {
  string owner_incarnation = 1;
  string requester_incarnation = 2;
}

message OpenTransferWindowResponse { string window_id = 1; }

message TransferTicket {
  string window_id = 1;
  uint32 slot = 2;
  uint64 generation = 3;
}

message QueryBlocksForTransferRequest {
  string namespace = 1;
  repeated bytes block_hashes = 2;
  string owner_incarnation = 3;        // Runtime UUID from discovery
  repeated uint64 residency_sequences = 4; // Parallel to block_hashes; exact insertions
  TransferTicket ticket = 5;           // Known before sending authorization
}

message QueryBlocksForTransferResponse {
  ResponseStatus status = 1;
  repeated TransferBlockInfo blocks = 2;
  uint32 lock_timeout_secs = 3;         // Source overdue threshold; expiry never releases pins
  string transfer_endpoint = 4;        // Mooncake segment name (host:port)
}

message ReleaseTransferLockRequest {
  TransferTicket ticket = 1;
}

message ReleaseTransferLockResponse {
  ResponseStatus status = 1;
  uint64 released_blocks = 2;
}

service Engine {
  // Reused across transfers; bounded idle metadata, no source allocation pins.
  rpc OpenTransferWindow(OpenTransferWindowRequest) returns (OpenTransferWindowResponse);
  // Cross-node transfer: authorize and pin specific blocks (serving side)
  rpc QueryBlocksForTransfer(QueryBlocksForTransferRequest) returns (QueryBlocksForTransferResponse);
  // Cross-node transfer: release block locks after Mooncake transfer completes
  rpc ReleaseTransferLock(ReleaseTransferLockRequest) returns (ReleaseTransferLockResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

enum ReplicaMedium {
  REPLICA_MEDIUM_UNKNOWN = 0;
  REPLICA_MEDIUM_DRAM = 1;
  REPLICA_MEDIUM_SSD = 2;
  REPLICA_MEDIUM_HBM = 3;
}

enum ReplicaRepresentation {
  REPLICA_REPRESENTATION_UNKNOWN = 0;
  REPLICA_REPRESENTATION_RAW = 1;
  REPLICA_REPRESENTATION_ANS = 2;
  REPLICA_REPRESENTATION_FP8 = 3;
  REPLICA_REPRESENTATION_TURBO_QUANT = 4;
  REPLICA_REPRESENTATION_MIXED = 5;
}

message ReplicaMetadata {
  ReplicaMedium medium = 1;
  ReplicaRepresentation representation = 2;
  optional uint64 stored_bytes = 3;
}

message InventoryRecord {
  string namespace = 1;
  bytes block_hash = 2;
  uint64 sequence = 3;
  bool present = 4;
  ReplicaMetadata metadata = 5;
}

enum InventoryScopeMode {
  INVENTORY_SCOPE_UNSPECIFIED = 0;
  INVENTORY_SCOPE_ALL_NAMESPACES = 1;
  INVENTORY_SCOPE_EXACT_NAMESPACES = 2;
}

message InventoryOpen {
  string protocol = 1;
  bytes cluster_uuid = 2;
  string source_node = 3;
  uint64 source_epoch = 4;
  bytes source_incarnation = 5;
  bytes requester_incarnation = 6;
  bytes scope_digest = 7;
  bytes session_id = 8;
  optional uint64 resume_sequence = 9;
  bytes installed_view_id = 10;
  InventoryScopeMode scope_mode = 11;
  repeated bytes scope_namespaces = 12;
}

message InventoryAck {
  uint64 consumed_frame_id = 1;
  bytes installed_view_id = 2;
  uint64 applied_sequence = 3;
}

message InventoryFlushThrough { uint64 target_sequence = 1; }

message InventoryClientFrame {
  oneof body {
    InventoryOpen open = 1;
    InventoryAck ack = 2;
    InventoryFlushThrough flush_through = 3;
  }
}

message InventorySnapshotBegin {
  bytes snapshot_id = 1;
  bytes view_id = 2;
  uint64 start_sequence = 3;
}

message InventorySnapshotPage {
  bytes snapshot_id = 1;
  uint64 page_number = 2;
  repeated InventoryRecord records = 3;
}

message InventoryDelta {
  uint64 from_exclusive = 1;
  uint64 through_inclusive = 2;
  repeated InventoryRecord records = 3;
}

message InventorySnapshotCommit {
  bytes snapshot_id = 1;
  bytes view_id = 2;
  uint64 through_sequence = 3;
  bytes transcript_digest = 4;
  uint64 page_count = 5;
}

message InventoryProgress {
  uint64 through_sequence = 1;
  uint64 source_head_sequence = 2;
}

message InventoryResetRequired { string reason = 1; }

message InventoryServerFrame {
  uint64 frame_id = 1;
  bytes session_id = 2;
  oneof body {
    InventorySnapshotBegin snapshot_begin = 3;
    InventorySnapshotPage snapshot_page = 4;
    InventoryDelta delta = 5;
    InventorySnapshotCommit snapshot_commit = 6;
    InventoryProgress progress = 7;
    InventoryResetRequired reset_required = 8;
  }
}

service Inventory {
  rpc InventorySession(stream InventoryClientFrame) returns (stream InventoryServerFrame);
}

// Query interest is separate from GPU lifecycle and peer transfer authorization.
// Targets are exported only over the authenticated node-local lifecycle socket.
service CacheQueryControl {
  rpc OpenInterest(OpenQueryInterestRequest) returns (QueryInterest);
  rpc Execute(QueryControlExecuteRequest) returns (QueryControlResponse);
  rpc Claim(QueryControlClaimRequest) returns (QueryControlResponse);
  rpc Cancel(QueryControlCancelRequest) returns (QueryControlEmpty);
  rpc Close(QueryInterest) returns (QueryControlEmpty);
}
message RegisteredQueryTarget {
  uint32 version = 1;
  string endpoint = 2;
  string instance_id = 3;
  string namespace = 4;
  string storage_namespace = 5;
  uint32 tp_size = 6;
  uint32 world_size = 7;
  bytes manager_incarnation = 8;
  bytes registration_generation = 9;
  bytes capability = 10;
}
message OpenQueryInterestRequest {
  RegisteredQueryTarget target = 1;
  bytes coordinator_incarnation = 2;
}
message QueryInterest {
  bytes id = 1;
  bytes manager_incarnation = 2;
}
message QueryControlExecuteRequest {
  QueryInterest interest = 1;
  bytes command = 2;
}
message QueryControlClaimRequest {
  QueryInterest interest = 1;
  uint64 operation_id = 2;
  uint64 revision = 3;
  bytes lease = 4;
}
message QueryControlCancelRequest {
  QueryInterest interest = 1;
  uint64 operation_id = 2;
  uint64 revision = 3;
}
message QueryControlResponse {
  bytes payload = 1;
}
message QueryControlEmpty {}

// Local bootstrap configuration. Query authority never imports foreign GPU mappings.
message ShardQueryTarget {
  string endpoint = 1;
  string namespace = 2;
  RegisteredQueryTarget target = 3;
}
message ConfigureShardQueriesRequest {
  SessionRequest local = 1;
  repeated ShardQueryTarget shards = 2;
}
