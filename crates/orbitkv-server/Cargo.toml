[package]
name = "orbitkv-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "orbitkv-cache-manager"

[lints]
workspace = true

[features]
test-hooks = ["orbitkv-core/test-hooks"]
default = ["cuda-13", "mooncake"]
cuda-13 = ["orbitkv-core/cuda-13"]
mooncake = ["orbitkv-core/mooncake"]
orbitte = ["orbitkv-core/orbitte"]
tracing = ["fastrace", "orbitkv-core/tracing"]

[lib]
name = "orbitkv_server"
path = "src/lib.rs"

[[bin]]
name = "orbitkv-cache-manager"
path = "src/main.rs"

[dependencies]
orbitkv-catalog.workspace = true
orbitkv-common.workspace = true
orbitkv-core = { workspace = true, default-features = false }
orbitkv-channel.workspace = true
orbitkv-state.workspace = true
etcd-client.workspace = true
orbitkv-proto = { path = "../orbitkv-proto" }
pyo3 = { workspace = true, features = ["auto-initialize"] }
cudarc.workspace = true
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
futures.workspace = true
rustix.workspace = true
clap.workspace = true
log.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-stream.workspace = true
uuid.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
tikv-jemallocator.workspace = true
fastrace = { workspace = true, features = ["enable"], optional = true }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
rustix = { workspace = true, features = ["time"] }
tempfile = "3"

[build-dependencies]
pyo3-build-config.workspace = true
